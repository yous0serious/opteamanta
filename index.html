<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BACKLOG DEFENSE 3000 ™</title>
</head>
<body>
<h1>📌 BACKLOG DEFENSE 3000 📌</h1>
<div class="sub">NEON-KFZ AG · Team „Prozessoptimierung“: Der Fachbereich schickt Anforderungen, Change Requests, Features und Objectives. Stell dein Team auf, bevor alles in die Deadline rauscht!</div>
<div id="wrap">
  <div id="frame"><div id="game"></div></div>
  <div id="side">
    <div class="stat">⚙️ Kapazität: <b id="money"></b> SP</div>
    <div class="stat">💖 Team-Moral: <b id="lives"></b> %</div>
    <div class="stat">🗓️ <b id="wave"></b> &nbsp; 🏆 <b id="score"></b></div>
    <div class="stat">🗺️ Karte: <b id="map"></b></div>
    <div id="mode" class="row" role="group" aria-label="Spielmodus">
      <button data-mode="challenge" title="30 Wellen – wer schafft das Release?">🏁 Challenge (30)</button>
      <button data-mode="endless" title="Bis zum Burnout">♾ Endlos</button>
    </div>
    <div id="info"></div>
    <button id="big">▶ SPRINT STARTEN</button>
    <div class="row"><button id="spd">⏩ x1</button><button id="mute">🔊 Sound</button></div>
    <button id="replay" hidden>💾 Replay herunterladen</button>
    <details id="lb" open>
      <summary>🏆 Bestenliste</summary>
      <div id="lb-tabs" class="row" role="group" aria-label="Zeitraum">
        <button data-period="day" class="active">Heute</button>
        <button data-period="week">Woche</button>
      </div>
      <ol id="lb-list"></ol>
      <div id="lb-status" aria-live="polite"></div>
      <div id="play-kind" class="row" role="group" aria-label="Spielart">
        <button data-kind="daily" class="active" title="Alle spielen heute dieselbe Karte – zählt für die Bestenliste">Daily</button>
        <button data-kind="free" title="Zufällige Karte, Challenge oder Endlos – zählt nicht">Freies Spiel</button>
      </div>
      <button id="team-name" hidden title="Teamname ändern"></button>
    </details>
  </div>
</div>
<div id="ticker"><span id="tk"></span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
