<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Whiteboard-Kachel, nahtlos: feine Struktur + Wischspuren. Eigenes Werk. -->
  <defs>
    <filter id="tex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0.05 0"/>
    </filter>
    <filter id="smear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.03" numOctaves="2" seed="5" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.65  0 0 0 0 0.75  0 0 0 0.09 -0.02"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#fbfbf7"/>
  <rect width="256" height="256" filter="url(#smear)"/>
  <rect width="256" height="256" filter="url(#tex)"/>
</svg>
